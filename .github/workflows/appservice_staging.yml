name: Build and deploy Python app to Azure Web App - staging

on:
  push:
    branches:
      - edcolby-microsoft/refactor-modular-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate dependency installation
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !__pycache__/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A94FCF756B44606B8F27BEA216AF33D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8CB75467C05A430DAB7CA8B9E0AF9847 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D7AAE4C8596430CA172E6820E301907 }}

      - name: Deploy to Azure Web App staging slot
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: DBX
          slot-name: staging
          package: .
